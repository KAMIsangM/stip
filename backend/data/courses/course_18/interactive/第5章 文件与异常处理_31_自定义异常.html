<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自定义异常类的定义与使用</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Microsoft YaHei', 'PingFang SC', 'Consolas', 'Monaco', monospace;
  background: linear-gradient(135deg, #0d1117 0%, #161b22 100%);
  min-height: 100vh; padding: 30px; color: #c9d1d9;
}
.container { max-width: 1000px; margin: 0 auto; }
.header { text-align: center; margin-bottom: 25px; }
.header h1 { color: #58a6ff; font-size: 28px; margin-bottom: 6px; }
.header p { color: #8b949e; font-size: 14px; }

.info-card {
  background: #161b22; border: 1px solid #30363d;
  border-radius: 12px; padding: 18px; margin-bottom: 20px;
}
.info-card h3 { color: #58a6ff; font-size: 17px; margin-bottom: 6px; }
.info-card p { color: #8b949e; font-size: 14px; line-height: 1.6; }

.main-layout {
  display: flex; gap: 20px; margin-bottom: 20px;
}
@media (max-width: 768px) { .main-layout { flex-direction: column; } }

/* Code panel */
.code-panel {
  flex: 1; background: #0d1117; border: 1px solid #30363d;
  border-radius: 12px; overflow: hidden; min-width: 0;
}
.code-header {
  background: #161b22; padding: 8px 16px; border-bottom: 1px solid #30363d;
  font-size: 12px; color: #8b949e; display: flex; align-items: center; gap: 8px;
}
.code-dot { width: 10px; height: 10px; border-radius: 50%; }
.code-dot.red { background: #ff5f56; }
.code-dot.yellow { background: #ffbd2e; }
.code-dot.green { background: #27c93f; }
.code-body {
  padding: 16px; font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
  font-size: 14px; line-height: 1.8; overflow-x: auto;
}
.code-line {
  padding: 2px 8px; border-radius: 4px; white-space: pre;
  transition: all 0.3s ease;
}
.code-line.executing {
  background: rgba(88,166,255,0.15); border-left: 3px solid #58a6ff;
  color: #fff;
}
.code-line.executed {
  color: #484f58; opacity: 0.6;
}
.code-keyword { color: #ff7b72; }
.code-string { color: #a5d6ff; }
.code-number { color: #79c0ff; }
.code-comment { color: #484f58; font-style: italic; }
.code-func { color: #d2a8ff; }

/* Variable panel */
.var-panel {
  width: 260px; background: #161b22; border: 1px solid #30363d;
  border-radius: 12px; padding: 16px; flex-shrink: 0;
}
.var-panel h3 { color: #58a6ff; font-size: 15px; margin-bottom: 12px; }
.var-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 12px; background: #0d1117; border: 1px solid #21262d;
  border-radius: 6px; margin-bottom: 8px; transition: all 0.3s ease;
}
.var-item.changed {
  border-color: #d2a8ff; background: rgba(210,168,255,0.1);
  animation: varFlash 0.6s ease;
}
@keyframes varFlash {
  0%, 100% { background: #0d1117; }
  50% { background: rgba(210,168,255,0.2); }
}
.var-name { font-size: 13px; color: #d2a8ff; font-family: 'Consolas', monospace; }
.var-value { font-size: 14px; color: #79c0ff; font-weight: bold; font-family: 'Consolas', monospace; }

/* Output panel */
.output-panel {
  background: #0d1117; border: 1px solid #30363d; border-radius: 8px;
  padding: 12px 16px; margin-top: 12px;
}
.output-panel h4 { color: #8b949e; font-size: 12px; margin-bottom: 6px; }
.output-content { color: #7ee787; font-family: 'Consolas', monospace; font-size: 13px; min-height: 20px; }

.step-info {
  text-align: center; margin-top: 12px; font-size: 14px; color: #8b949e;
}

.controls {
  display: flex; gap: 12px; justify-content: center;
  flex-wrap: wrap; margin-bottom: 15px;
}
.btn {
  padding: 10px 24px; border: none; border-radius: 25px;
  font-size: 14px; cursor: pointer; transition: all 0.3s;
  font-weight: 600;
}
.btn-primary { background: #58a6ff; color: #0d1117; }
.btn-primary:hover { background: #4a90e2; }
.btn-secondary { background: #21262d; color: #c9d1d9; border: 1px solid #30363d; }
.btn-secondary:hover { background: #30363d; }
.btn-success { background: #3fb950; color: #0d1117; }
.btn-danger { background: #da3633; color: #fff; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.speed-control {
  display: flex; align-items: center; gap: 10px;
  justify-content: center; margin-bottom: 20px; color: #8b949e;
}
.speed-control input[type="range"] { width: 120px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>自定义异常类的定义与使用</h1>
    <p>展示自定义异常类的创建和抛出过程</p>
  </div>

  <div class="info-card">
    <h3>💻 代码说明</h3>
    <p>通过继承Exception类可以创建自定义异常。示例中定义ValueTooSmallError异常，并在函数check_value中当输入小于10时抛出自定义异常。try块捕获该异常并处理。</p>
  </div>

  <div class="main-layout">
    <!-- Code panel -->
    <div class="code-panel">
      <div class="code-header">
        <span class="code-dot red"></span>
        <span class="code-dot yellow"></span>
        <span class="code-dot green"></span>
        <span style="margin-left:8px;">custom_exception.py</span>
      </div>
      <div class="code-body" id="codeBody"></div>
    </div>

    <!-- Variable panel -->
    <div class="var-panel">
      <h3>📊 变量状态</h3>
      <div id="varContainer">
        <p style="color:#484f58;font-size:13px;">等待执行...</p>
      </div>
      <div class="output-panel">
        <h4>🖥 输出</h4>
        <div class="output-content" id="outputContent"></div>
      </div>
    </div>
  </div>

  <div class="step-info" id="stepInfo"></div>

  <div class="controls">
    <button class="btn btn-primary" id="btnStart">▶ 开始执行</button>
    <button class="btn btn-secondary" id="btnPrev">◀ 上一步</button>
    <button class="btn btn-secondary" id="btnNext">下一步 ▶</button>
    <button class="btn btn-success" id="btnAuto">⏩ 自动执行</button>
    <button class="btn btn-danger" id="btnReset">↻ 重置</button>
  </div>

  <div class="speed-control">
    <label>⚡ 执行速度：</label>
    <input type="range" id="speedSlider" min="200" max="3000" value="1000" step="50">
    <span id="speedLabel">1000ms</span>
  </div>
</div>

<script>
const ANIMATION_STEPS = [{"line": 0, "variables": {}, "changed_vars": [], "output": "", "description": "定义自定义异常类ValueTooSmallError，继承自Exception"}, {"line": 6, "variables": {}, "changed_vars": [], "output": "", "description": "定义函数check_value，检查参数是否小于10"}, {"line": 11, "variables": {}, "changed_vars": [], "output": "", "description": "进入try块，调用check_value(5)"}, {"line": 7, "variables": {"x": 5}, "changed_vars": ["x"], "output": "", "description": "进入函数，x=5，判断 5<10 成立"}, {"line": 8, "variables": {"x": 5}, "changed_vars": [], "output": "", "description": "抛出ValueTooSmallError异常，传入x=5"}, {"line": 12, "variables": {"e": "ValueTooSmallError: 值 5 太小了"}, "changed_vars": ["e"], "output": "", "description": "捕获异常，对象赋给e"}, {"line": 13, "variables": {"e": "ValueTooSmallError: 值 5 太小了"}, "changed_vars": [], "output": "捕获异常: 值 5 太小了", "description": "打印异常信息"}];
const CODE_LINES = ["class ValueTooSmallError(Exception):", "    def __init__(self, value):", "        self.value = value", "        super().__init__(f'值 {value} 太小了')", "", "def check_value(x):", "    if x < 10:", "        raise ValueTooSmallError(x)", "    print('值符合要求')", "", "try:", "    check_value(5)", "except ValueTooSmallError as e:", "    print('捕获异常:', e)"];
let currentStep = -1;
let isAutoPlaying = false;
let autoTimer = null;

function highlightCode(code) {
  return code
    .replace(/\b(def|class|if|else|elif|for|while|return|import|from|in|not|and|or|True|False|None|try|except|finally|with|as|pass|break|continue|yield|lambda|global|nonlocal|assert|raise|del)\b/g, '<span class="code-keyword">$1</span>')
    .replace(/\b([a-zA-Z_]\w*)\s*\(/g, '<span class="code-func">$1</span>(')
    .replace(/(\d+\.?\d*)/g, '<span class="code-number">$1</span>')
    .replace(/(["'].*?["'])/g, '<span class="code-string">$1</span>')
    .replace(/(#.*)/g, '<span class="code-comment">$1</span>');
}

function buildCodeDisplay() {
  const container = document.getElementById('codeBody');
  container.innerHTML = CODE_LINES.map((line, i) => 
    `<div class="code-line" data-line="${i}">${highlightCode(line)}</div>`
  ).join('');
}

function buildVariables(vars) {
  const container = document.getElementById('varContainer');
  if (!vars || Object.keys(vars).length === 0) {
    container.innerHTML = '<p style="color:#484f58;font-size:13px;">无变量</p>';
    return;
  }
  container.innerHTML = Object.entries(vars).map(([name, val]) => `
    <div class="var-item" data-var="${name}">
      <span class="var-name">${name}</span>
      <span class="var-value">${val}</span>
    </div>
  `).join('');
}

function resetState() {
  currentStep = -1;
  document.querySelectorAll('.code-line').forEach(el => el.classList.remove('executing', 'executed'));
  buildVariables(ANIMATION_STEPS.length > 0 ? ANIMATION_STEPS[0].variables : {});
  document.getElementById('outputContent').textContent = '';
  document.getElementById('stepInfo').textContent = '';
  stopAutoPlay();
  updateButtons();
}

function applyStep(stepIdx) {
  if (stepIdx < 0 || stepIdx >= ANIMATION_STEPS.length) return;
  const step = ANIMATION_STEPS[stepIdx];
  const speed = parseInt(document.getElementById('speedSlider').value);

  // Clear previous highlights
  document.querySelectorAll('.code-line').forEach(el => el.classList.remove('executing'));
  
  // Highlight current line
  if (step.line !== undefined) {
    const lines = document.querySelectorAll('.code-line');
    lines.forEach((el, i) => {
      if (i < step.line) el.classList.add('executed');
      else if (i === step.line) el.classList.add('executing');
      else el.classList.remove('executed');
    });
  }

  // Update variables with flash animation
  if (step.variables) {
    buildVariables(step.variables);
    if (step.changed_vars) {
      step.changed_vars.forEach(name => {
        const item = document.querySelector(`.var-item[data-var="${name}"]`);
        if (item) {
          item.classList.add('changed');
          setTimeout(() => item.classList.remove('changed'), 600);
        }
      });
    }
  }

  // Update output
  if (step.output) {
    const outEl = document.getElementById('outputContent');
    outEl.textContent = step.output;
    anime({ targets: outEl, opacity: [0.3, 1], duration: speed * 0.3, easing: 'easeOutQuad' });
  }

  // Step info
  document.getElementById('stepInfo').textContent = 
    `步骤 ${stepIdx + 1}/${ANIMATION_STEPS.length} — ${step.description || ''}`;

  currentStep = stepIdx;
  updateButtons();
}

function updateButtons() {
  document.getElementById('btnPrev').disabled = currentStep <= 0;
  document.getElementById('btnNext').disabled = currentStep >= ANIMATION_STEPS.length - 1;
}

function nextStep() {
  if (currentStep < ANIMATION_STEPS.length - 1) applyStep(currentStep + 1);
}
function prevStep() {
  if (currentStep > 0) applyStep(currentStep - 1);
  else if (currentStep === 0) resetState();
}

function startAnimation() {
  resetState();
  setTimeout(() => nextStep(), 300);
}

function toggleAutoPlay() {
  if (isAutoPlaying) {
    stopAutoPlay();
    document.getElementById('btnAuto').textContent = '⏩ 自动执行';
  } else {
    isAutoPlaying = true;
    document.getElementById('btnAuto').textContent = '⏸ 暂停';
    autoPlayLoop();
  }
}
function autoPlayLoop() {
  if (!isAutoPlaying) return;
  if (currentStep >= ANIMATION_STEPS.length - 1) {
    stopAutoPlay();
    document.getElementById('btnAuto').textContent = '⏩ 自动执行';
    return;
  }
  nextStep();
  const speed = parseInt(document.getElementById('speedSlider').value);
  autoTimer = setTimeout(autoPlayLoop, speed + 200);
}
function stopAutoPlay() {
  isAutoPlaying = false;
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
}

document.getElementById('speedSlider').addEventListener('input', function() {
  document.getElementById('speedLabel').textContent = this.value + 'ms';
});
document.getElementById('btnStart').addEventListener('click', startAnimation);
document.getElementById('btnPrev').addEventListener('click', prevStep);
document.getElementById('btnNext').addEventListener('click', nextStep);
document.getElementById('btnAuto').addEventListener('click', toggleAutoPlay);
document.getElementById('btnReset').addEventListener('click', resetState);
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') { e.preventDefault(); nextStep(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevStep(); }
  else if (e.key === ' ') { e.preventDefault(); toggleAutoPlay(); }
});

// Init
buildCodeDisplay();
if (ANIMATION_STEPS.length > 0) buildVariables(ANIMATION_STEPS[0].variables || {});
updateButtons();
</script>
</body>
</html>
