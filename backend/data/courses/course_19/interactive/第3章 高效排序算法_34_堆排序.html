<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>堆排序动画演示</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh; padding: 30px; color: #333;
}
.container { max-width: 960px; margin: 0 auto; }
.header {
  text-align: center; margin-bottom: 30px;
}
.header h1 { color: #fff; font-size: 28px; margin-bottom: 8px; }
.header p { color: rgba(255,255,255,0.8); font-size: 14px; }

.info-card {
  background: rgba(255,255,255,0.95); border-radius: 12px;
  padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}
.info-card h3 { color: #667eea; font-size: 18px; margin-bottom: 8px; }
.info-card p { color: #666; font-size: 14px; line-height: 1.6; }

/* === Tree Visualization Area === */
.viz-area {
  background: rgba(255,255,255,0.95); border-radius: 12px;
  padding: 25px 30px; margin-bottom: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  text-align: center; min-height: 420px; position: relative;
}

.tree-wrapper {
  display: flex; align-items: flex-start; justify-content: center;
  gap: 30px; min-height: 290px;
}

/* Tree container */
.tree-container {
  position: relative; width: 560px; height: 270px; flex-shrink: 0;
}
.tree-container svg {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
}

/* Tree nodes */
.tree-node {
  position: absolute; width: 52px; height: 44px;
  border-radius: 10px; display: flex; align-items: center;
  justify-content: center; font-size: 18px; font-weight: bold;
  color: #fff; transition: all 0.35s ease;
  border: 3px solid transparent; z-index: 2;
}
.tree-node .idx-label {
  position: absolute; top: -18px; font-size: 11px; color: #999;
  font-weight: normal; white-space: nowrap;
}
.tree-node.comparing {
  border-color: #ff6b6b; box-shadow: 0 0 16px rgba(255,107,107,0.5);
  transform: scale(1.12);
}
.tree-node.swapping {
  border-color: #667eea; box-shadow: 0 0 20px rgba(102,126,234,0.7);
  transform: scale(1.15);
}
.tree-node.removed {
  opacity: 0.25; transform: scale(0.7); pointer-events: none;
}

/* Tree connection lines */
.tree-line {
  stroke: #ccc; stroke-width: 2; fill: none;
  transition: stroke 0.35s;
}
.tree-line.highlight {
  stroke: #ff6b6b; stroke-width: 3;
}

/* Sorted area (right side) */
.sorted-area {
  min-width: 120px; text-align: center;
}
.sorted-title {
  font-size: 14px; color: #888; margin-bottom: 8px;
  display: flex; align-items: center; justify-content: center; gap: 4px;
}
.sorted-stack {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.sorted-item {
  width: 52px; height: 40px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: bold; color: #fff;
  border: 2px solid #2ed573; box-shadow: 0 0 8px rgba(46,213,115,0.3);
  transition: all 0.35s ease;
}
.sorted-item.new {
  animation: popIn 0.4s ease-out;
}
@keyframes popIn {
  0% { transform: scale(0); opacity: 0; }
  70% { transform: scale(1.15); }
  100% { transform: scale(1); opacity: 1; }
}

/* Array row at bottom */
.array-row {
  display: flex; justify-content: center; gap: 8px; margin-top: 18px;
}
.array-cell {
  width: 44px; height: 32px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600; color: #555;
  background: #f0f0f0; border: 2px solid #e0e0e0;
  transition: all 0.35s ease; position: relative;
}
.array-cell .cell-idx {
  position: absolute; top: -16px; font-size: 10px; color: #bbb;
}
.array-cell.comparing {
  border-color: #ff6b6b; background: #fff0f0; color: #ff6b6b;
}
.array-cell.swapping {
  border-color: #667eea; background: #eeeaff; color: #667eea;
}
.array-cell.sorted-cell {
  border-color: #2ed573; background: #e8f8ee; color: #2ed573;
}

/* Step indicator */
.step-info {
  margin-top: 16px; font-size: 15px; color: #555;
}
.step-number {
  display: inline-block; background: #667eea; color: #fff;
  padding: 4px 12px; border-radius: 20px; font-size: 13px;
  margin-right: 8px;
}

/* Controls */
.controls {
  display: flex; gap: 12px; justify-content: center;
  flex-wrap: wrap; margin-bottom: 20px;
}
.btn {
  padding: 10px 24px; border: none; border-radius: 25px;
  font-size: 14px; cursor: pointer; transition: all 0.3s;
  font-weight: 600; letter-spacing: 0.5px;
}
.btn-primary { background: #667eea; color: #fff; }
.btn-primary:hover { background: #5a6fd6; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102,126,234,0.4); }
.btn-secondary { background: #e8e8e8; color: #555; }
.btn-secondary:hover { background: #ddd; }
.btn-success { background: #2ed573; color: #fff; }
.btn-success:hover { background: #26bc66; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.speed-control {
  display: flex; align-items: center; gap: 10px;
  justify-content: center; margin-bottom: 20px; color: #fff;
}
.speed-control label { font-size: 13px; }
.speed-control input[type="range"] { width: 120px; }

.status-bar {
  background: rgba(255,255,255,0.9); border-radius: 8px;
  padding: 12px 20px; display: flex; justify-content: space-between;
  align-items: center; font-size: 13px; color: #666;
}
.status-bar .comparisons { color: #667eea; font-weight: bold; }
.status-bar .swaps { color: #2ed573; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>📕 堆排序动画演示</h1>
    <p>堆排序 — 二叉树堆结构可视化</p>
  </div>

  <div class="info-card">
    <h3>📖 算法原理</h3>
    <p>堆排序利用最大堆的性质：堆顶为最大元素。首先将数组构建成最大堆，然后反复将堆顶元素与末尾元素交换，并调整剩余元素保持最大堆结构，从而得到有序序列。</p>
  </div>

  <div class="viz-area" id="vizArea">
    <div class="tree-wrapper">
      <div class="tree-container" id="treeContainer"></div>
      <div class="sorted-area" id="sortedArea">
        <div class="sorted-title">📕 已排序</div>
        <div class="sorted-stack" id="sortedStack"></div>
      </div>
    </div>
    <div class="array-row" id="arrayRow"></div>
    <div class="step-info">
      <span class="step-number" id="stepNum">0/0</span>
      <span id="stepDesc">点击"开始动画"演示排序过程</span>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="btnStart">▶ 开始动画</button>
    <button class="btn btn-secondary" id="btnPrev">◀ 上一步</button>
    <button class="btn btn-secondary" id="btnNext">下一步 ▶</button>
    <button class="btn btn-success" id="btnAuto">⏩ 自动播放</button>
    <button class="btn btn-secondary" id="btnReset">↻ 重置</button>
  </div>

  <div class="speed-control">
    <label>⚡ 播放速度：</label>
    <input type="range" id="speedSlider" min="100" max="2000" value="800" step="50">
    <span id="speedLabel" style="min-width:45px;">800ms</span>
  </div>

  <div class="status-bar">
    <span>📊 数据量：<b>6</b></span>
    <span class="comparisons">比较次数：<span id="cmpCount">0</span></span>
    <span class="swaps">交换次数：<span id="swapCount">0</span></span>
  </div>
</div>

<script>
// ===== Correctly generated heap sort steps =====
(function() {
  const initArr = [5, 3, 8, 1, 9, 2];
  const steps = [];
  const a = [...initArr];
  const n = a.length;

  function heapify(heapSize, rootIdx, phase) {
    let largest = rootIdx;
    const left = 2 * rootIdx + 1;
    const right = 2 * rootIdx + 2;
    if (left < heapSize && right < heapSize) {
      steps.push({ array: [...a], comparing: [rootIdx, left, right], swapping: [], sorted: [], description: `${phase}：比较根 a[${rootIdx}]=${a[rootIdx]} 与左右子节点 a[${left}]=${a[left]}、a[${right}]=${a[right]}` });
    } else if (left < heapSize) {
      steps.push({ array: [...a], comparing: [rootIdx, left], swapping: [], sorted: [], description: `${phase}：比较根 a[${rootIdx}]=${a[rootIdx]} 与左子节点 a[${left}]=${a[left]}` });
    } else {
      return;
    }
    if (left < heapSize && a[left] > a[largest]) largest = left;
    if (right < heapSize && a[right] > a[largest]) largest = right;
    if (largest !== rootIdx) {
      const tmp = a[rootIdx];
      a[rootIdx] = a[largest];
      a[largest] = tmp;
      steps.push({ array: [...a], comparing: [rootIdx, largest], swapping: [rootIdx, largest], sorted: [], description: `${phase}：a[${largest}]=${a[rootIdx]} 最大，交换 a[${rootIdx}] 与 a[${largest}]` });
      heapify(heapSize, largest, phase);
    } else {
      steps.push({ array: [...a], comparing: [rootIdx], swapping: [], sorted: [], description: `${phase}：a[${rootIdx}]=${a[rootIdx]} 已是最大，无需调整` });
    }
  }

  steps.push({ array: [...a], comparing: [], swapping: [], sorted: [], description: `初始数组：[${a.join(', ')}]` });

  for (let i = Math.floor(n / 2) - 1; i >= 0; i--) {
    heapify(n, i, '建堆');
  }
  steps.push({ array: [...a], comparing: [], swapping: [], sorted: [], description: `最大堆构建完成：[${a.join(', ')}]` });

  const sortedIndices = [];
  for (let i = n - 1; i > 0; i--) {
    const swapTemp = a[0];
    a[0] = a[i];
    a[i] = swapTemp;
    sortedIndices.push(i);
    steps.push({ array: [...a], comparing: [0, i], swapping: [0, i], sorted: [...sortedIndices], description: `交换堆顶 ${swapTemp} 与末尾 a[${i}]=${a[0]}，将 ${swapTemp} 固定到位置 ${i}` });
    heapify(i, 0, '调整堆');
  }
  sortedIndices.push(0);
  steps.push({ array: [...a], comparing: [], swapping: [], sorted: sortedIndices.sort((x,y)=>x-y), description: `排序完成！最终结果：[${a.join(', ')}]` });

  window.ANIMATION_STEPS = steps;
})();
const ANIMATION_STEPS = window.ANIMATION_STEPS;
const NODE_COLORS = ['#667eea','#764ba2','#f093fb','#f5576c','#4facfe','#43e97b','#fa709a','#fee140'];

// Tree layout: precomputed x-centers for up to 8 nodes (3 levels)
const TREE_LAYOUT = [
  { lvl: 0, cx: 280, y: 0 },     // idx 0 - root
  { lvl: 1, cx: 130, y: 95 },    // idx 1 - left child of 0
  { lvl: 1, cx: 430, y: 95 },    // idx 2 - right child of 0
  { lvl: 2, cx: 55,  y: 195 },   // idx 3 - left child of 1
  { lvl: 2, cx: 205, y: 195 },   // idx 4 - right child of 1
  { lvl: 2, cx: 355, y: 195 },   // idx 5 - left child of 2
  { lvl: 2, cx: 505, y: 195 },   // idx 6 - right child of 2
];
const NODE_W = 52, NODE_H = 44;

// ===== State =====
let currentStep = -1;
let isAutoPlaying = false;
let autoTimer = null;
let cmpCount = 0;
let swapCount = 0;
let prevSortedLen = 0;

function getHeapSize(step) {
  if (!step.sorted || step.sorted.length === 0) return ANIMATION_STEPS[0].array.length;
  return ANIMATION_STEPS[0].array.length - step.sorted.length;
}

function renderTree(step) {
  const container = document.getElementById('treeContainer');
  const heapSize = getHeapSize(step);
  const sortedSet = new Set(step.sorted);
  const comparingSet = new Set(step.comparing || []);
  const swappingSet = new Set(step.swapping || []);

  // Build SVG lines
  let svgHtml = '<svg>';
  for (let parent = 0; parent < heapSize; parent++) {
    const left = 2 * parent + 1;
    if (left < heapSize) {
      const p = TREE_LAYOUT[parent], c = TREE_LAYOUT[left];
      const highlight = (comparingSet.has(parent) && comparingSet.has(left)) || (swappingSet.has(parent) && swappingSet.has(left));
      svgHtml += `<line x1="${p.cx}" y1="${p.y + NODE_H}" x2="${c.cx}" y2="${c.y}" class="tree-line${highlight ? ' highlight' : ''}" />`;
    }
    const right = 2 * parent + 2;
    if (right < heapSize) {
      const p = TREE_LAYOUT[parent], c = TREE_LAYOUT[right];
      const highlight = (comparingSet.has(parent) && comparingSet.has(right)) || (swappingSet.has(parent) && swappingSet.has(right));
      svgHtml += `<line x1="${p.cx}" y1="${p.y + NODE_H}" x2="${c.cx}" y2="${c.y}" class="tree-line${highlight ? ' highlight' : ''}" />`;
    }
  }
  svgHtml += '</svg>';

  // Build nodes (only heap elements, sorted elements go to sorted area)
  let nodesHtml = '';
  for (let i = 0; i < heapSize; i++) {
    if (sortedSet.has(i)) continue; // shouldn't happen with heapSize calculation, but safe
    const pos = TREE_LAYOUT[i];
    const cls = ['tree-node'];
    if (comparingSet.has(i)) cls.push('comparing');
    if (swappingSet.has(i)) cls.push('swapping');
    nodesHtml += `<div class="${cls.join(' ')}" style="left:${pos.cx - NODE_W/2}px;top:${pos.y}px;background:${NODE_COLORS[i % NODE_COLORS.length]};"><span class="idx-label">[${i}]</span>${step.array[i]}</div>`;
  }
  // Also show removed nodes (sorted, now in sorted area) as faded in the tree
  for (let i = heapSize; i < step.array.length; i++) {
    const pos = TREE_LAYOUT[i];
    nodesHtml += `<div class="tree-node removed" style="left:${pos.cx - NODE_W/2}px;top:${pos.y}px;background:${NODE_COLORS[i % NODE_COLORS.length]};"><span class="idx-label">[${i}]</span>${step.array[i]}</div>`;
  }

  container.innerHTML = svgHtml + nodesHtml;
}

function renderSorted(step) {
  const stack = document.getElementById('sortedStack');
  if (!step.sorted || step.sorted.length === 0) {
    stack.innerHTML = '<div style="font-size:12px;color:#ccc;">等待提取…</div>';
    return;
  }
  const newCount = step.sorted.length;
  const wasCount = prevSortedLen;
  prevSortedLen = newCount;

  let html = '';
  // Display in original index order (ascending)
  const sorted = [...step.sorted].sort((a,b)=>a-b);
  for (const idx of sorted) {
    const isNew = idx === step.sorted[step.sorted.length - 1];
    html += `<div class="sorted-item${isNew ? ' new' : ''}" style="background:${NODE_COLORS[idx % NODE_COLORS.length]};">${step.array[idx]}</div>`;
  }
  stack.innerHTML = html;
}

function renderArray(step) {
  const row = document.getElementById('arrayRow');
  const comparingSet = new Set(step.comparing || []);
  const swappingSet = new Set(step.swapping || []);
  const sortedSet = new Set(step.sorted || []);

  let html = '';
  step.array.forEach((val, idx) => {
    const cls = ['array-cell'];
    if (comparingSet.has(idx)) cls.push('comparing');
    if (swappingSet.has(idx)) cls.push('swapping');
    if (sortedSet.has(idx)) cls.push('sorted-cell');
    html += `<div class="${cls.join(' ')}"><span class="cell-idx">${idx}</span>${val}</div>`;
  });
  row.innerHTML = html;
}

function renderAll(step) {
  renderTree(step);
  renderSorted(step);
  renderArray(step);
  document.getElementById('stepDesc').textContent = step.description || '';
}

function resetState() {
  currentStep = -1;
  cmpCount = 0;
  swapCount = 0;
  prevSortedLen = 0;
  stopAutoPlay();
  const initialStep = ANIMATION_STEPS[0];
  renderAll(initialStep);
  updateUI();
}

function updateUI() {
  document.getElementById('stepNum').textContent = 
    `${Math.max(0, currentStep + 1)}/${ANIMATION_STEPS.length}`;
  document.getElementById('cmpCount').textContent = cmpCount;
  document.getElementById('swapCount').textContent = swapCount;
  document.getElementById('btnPrev').disabled = currentStep < 0;
  document.getElementById('btnNext').disabled = currentStep >= ANIMATION_STEPS.length - 1;
}

function applyStep(stepIdx) {
  if (stepIdx < 0 || stepIdx >= ANIMATION_STEPS.length) return;
  const step = ANIMATION_STEPS[stepIdx];

  if (step.comparing && step.comparing.length >= 2) cmpCount++;
  if (step.swapping && step.swapping.length === 2) swapCount++;

  renderAll(step);
  currentStep = stepIdx;
  updateUI();
}

function nextStep() {
  if (currentStep < ANIMATION_STEPS.length - 1) {
    applyStep(currentStep + 1);
  }
}

function prevStep() {
  if (currentStep > 0) {
    applyStep(currentStep - 1);
  } else if (currentStep === 0) {
    resetState();
  }
}

function startAnimation() {
  resetState();
  setTimeout(() => nextStep(), 300);
}

function toggleAutoPlay() {
  if (isAutoPlaying) {
    stopAutoPlay();
    document.getElementById('btnAuto').textContent = '⏩ 自动播放';
  } else {
    isAutoPlaying = true;
    document.getElementById('btnAuto').textContent = '⏸ 暂停';
    autoPlayLoop();
  }
}

function autoPlayLoop() {
  if (!isAutoPlaying) return;
  if (currentStep >= ANIMATION_STEPS.length - 1) {
    stopAutoPlay();
    document.getElementById('btnAuto').textContent = '⏩ 自动播放';
    return;
  }
  nextStep();
  const speed = parseInt(document.getElementById('speedSlider').value);
  autoTimer = setTimeout(autoPlayLoop, speed + 200);
}

function stopAutoPlay() {
  isAutoPlaying = false;
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
}

// Speed slider
document.getElementById('speedSlider').addEventListener('input', function() {
  document.getElementById('speedLabel').textContent = this.value + 'ms';
});

// Button events
document.getElementById('btnStart').addEventListener('click', startAnimation);
document.getElementById('btnPrev').addEventListener('click', prevStep);
document.getElementById('btnNext').addEventListener('click', nextStep);
document.getElementById('btnAuto').addEventListener('click', toggleAutoPlay);
document.getElementById('btnReset').addEventListener('click', resetState);

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') { e.preventDefault(); nextStep(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevStep(); }
  else if (e.key === ' ') { e.preventDefault(); toggleAutoPlay(); }
});

// Initialize
resetState();
</script>
</body>
</html>
