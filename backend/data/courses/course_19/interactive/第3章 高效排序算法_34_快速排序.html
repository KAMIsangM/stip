<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>快速排序动画演示</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh; padding: 30px; color: #333;
}
.container { max-width: 900px; margin: 0 auto; }
.header {
  text-align: center; margin-bottom: 30px;
}
.header h1 { color: #fff; font-size: 28px; margin-bottom: 8px; }
.header p { color: rgba(255,255,255,0.8); font-size: 14px; }

/* Algorithm info card */
.info-card {
  background: rgba(255,255,255,0.95); border-radius: 12px;
  padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}
.info-card h3 { color: #667eea; font-size: 18px; margin-bottom: 8px; }
.info-card p { color: #666; font-size: 14px; line-height: 1.6; }

/* Visualization area */
.viz-area {
  background: rgba(255,255,255,0.95); border-radius: 12px;
  padding: 30px; margin-bottom: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  text-align: center; min-height: 300px;
}
.array-container {
  display: flex; justify-content: center; align-items: flex-end;
  gap: 10px; min-height: 200px; padding: 20px 0;
}
.bar {
  width: 55px; border-radius: 6px 6px 0 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-end;
  transition: transform 0.2s;
  cursor: default; position: relative;
}
.bar-label {
  margin-bottom: 6px; font-size: 16px; font-weight: bold;
  color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.2);
}
.bar.comparing { 
  box-shadow: 0 0 15px rgba(255,107,107,0.6);
  transform: translateY(-8px);
}
.bar.swapping {
  box-shadow: 0 0 20px rgba(102,126,234,0.8);
  transform: translateY(-12px) scale(1.05);
}
.bar.sorted {
  box-shadow: 0 0 10px rgba(46,213,115,0.4);
}

/* Step indicator */
.step-info {
  margin-top: 20px; font-size: 15px; color: #555;
}
.step-number {
  display: inline-block; background: #667eea; color: #fff;
  padding: 4px 12px; border-radius: 20px; font-size: 13px;
  margin-right: 8px;
}

/* Controls */
.controls {
  display: flex; gap: 12px; justify-content: center;
  flex-wrap: wrap; margin-bottom: 20px;
}
.btn {
  padding: 10px 24px; border: none; border-radius: 25px;
  font-size: 14px; cursor: pointer; transition: all 0.3s;
  font-weight: 600; letter-spacing: 0.5px;
}
.btn-primary { background: #667eea; color: #fff; }
.btn-primary:hover { background: #5a6fd6; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102,126,234,0.4); }
.btn-secondary { background: #e8e8e8; color: #555; }
.btn-secondary:hover { background: #ddd; }
.btn-success { background: #2ed573; color: #fff; }
.btn-success:hover { background: #26bc66; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Speed slider */
.speed-control {
  display: flex; align-items: center; gap: 10px;
  justify-content: center; margin-bottom: 20px; color: #fff;
}
.speed-control label { font-size: 13px; }
.speed-control input[type="range"] { width: 120px; }

/* Status bar */
.status-bar {
  background: rgba(255,255,255,0.9); border-radius: 8px;
  padding: 12px 20px; display: flex; justify-content: space-between;
  align-items: center; font-size: 13px; color: #666;
}
.status-bar .comparisons { color: #667eea; font-weight: bold; }
.status-bar .swaps { color: #2ed573; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>快速排序动画演示</h1>
    <p>快速排序 — 快速排序过程可视化</p>
  </div>

  <div class="info-card">
    <h3>📖 算法原理</h3>
    <p>快速排序采用分治策略，选择一个基准元素，将数组分为两部分：小于基准的在左，大于基准的在右，然后递归地对左右两部分进行同样的操作，最终达到整个序列有序。</p>
  </div>

  <div class="viz-area">
    <div class="array-container" id="arrayContainer"></div>
    <div class="step-info">
      <span class="step-number" id="stepNum">0/0</span>
      <span id="stepDesc">点击"开始动画"演示排序过程</span>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="btnStart">▶ 开始动画</button>
    <button class="btn btn-secondary" id="btnPrev">◀ 上一步</button>
    <button class="btn btn-secondary" id="btnNext">下一步 ▶</button>
    <button class="btn btn-success" id="btnAuto">⏩ 自动播放</button>
    <button class="btn btn-secondary" id="btnReset">↻ 重置</button>
  </div>

  <div class="speed-control">
    <label>⚡ 播放速度：</label>
    <input type="range" id="speedSlider" min="100" max="2000" value="800" step="50">
    <span id="speedLabel" style="min-width:45px;">800ms</span>
  </div>

  <div class="status-bar">
    <span>📊 数据量：<b>6</b></span>
    <span class="comparisons">比较次数：<span id="cmpCount">0</span></span>
    <span class="swaps">交换次数：<span id="swapCount">0</span></span>
  </div>
</div>

<script>
// ===== Animation Data (injected by Jinja2) =====
const ANIMATION_STEPS = [{"array": [5, 3, 8, 1, 9, 2], "comparing": [0, 5], "swapping": [], "sorted": [], "description": "基准选择第一个元素5，从右向左找小于5的数，找到2"}, {"array": [2, 3, 8, 1, 9, 5], "comparing": [0, 2], "swapping": [0, 5], "sorted": [], "description": "将2与基准5交换，2到左边，5到右边"}, {"array": [2, 3, 5, 1, 9, 8], "comparing": [2, 3], "swapping": [2, 3], "sorted": [], "description": "从左向右找大于5的数，找到8，从右向左找小于5的数，找到1，交换8和1"}, {"array": [2, 3, 1, 5, 9, 8], "comparing": [3, 4], "swapping": [3, 4], "sorted": [], "description": "继续扫描，9>5，8>5，最终基准5放到正确位置"}, {"array": [1, 2, 3, 5, 9, 8], "comparing": [0, 2], "swapping": [0, 2], "sorted": [3], "description": "递归左半部分，基准选1，右半部分基准选9，但先处理左半部分"}, {"array": [1, 2, 3, 5, 8, 9], "comparing": [4, 5], "swapping": [4, 5], "sorted": [0, 1, 2, 3], "description": "左半部分有序，右半部分9和8交换后有序"}, {"array": [1, 2, 3, 5, 8, 9], "comparing": [], "swapping": [], "sorted": [0, 1, 2, 3, 4, 5], "description": "全部排序完成"}];
const COLORS = ['#667eea','#764ba2','#f093fb','#f5576c','#4facfe','#43e97b','#fa709a','#fee140'];

// ===== State =====
let currentStep = -1;
let bars = [];
let isAutoPlaying = false;
let autoTimer = null;
let cmpCount = 0;
let swapCount = 0;

// ===== Initial data =====
let data = ANIMATION_STEPS.length > 0 ? [...ANIMATION_STEPS[0].array] : [5, 3, 8, 1, 9, 2];
const maxVal = Math.max(...data);

function createBars() {
  const container = document.getElementById('arrayContainer');
  container.innerHTML = '';
  bars = [];
  data.forEach((val, idx) => {
    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.height = (val / maxVal * 180 + 20) + 'px';
    bar.style.background = COLORS[idx % COLORS.length];
    bar.innerHTML = `<span class="bar-label">${val}</span>`;
    container.appendChild(bar);
    bars.push(bar);
  });
}

function resetState() {
  currentStep = -1;
  cmpCount = 0;
  swapCount = 0;
  if (ANIMATION_STEPS.length > 0) {
    data = [...ANIMATION_STEPS[0].array];
  }
  createBars();
  updateUI();
  stopAutoPlay();
}

function updateUI() {
  document.getElementById('stepNum').textContent = 
    `${Math.max(0, currentStep + 1)}/${ANIMATION_STEPS.length}`;
  document.getElementById('cmpCount').textContent = cmpCount;
  document.getElementById('swapCount').textContent = swapCount;
  document.getElementById('btnPrev').disabled = currentStep < 0;
  document.getElementById('btnNext').disabled = currentStep >= ANIMATION_STEPS.length - 1;
}

function applyStep(stepIdx) {
  if (stepIdx < 0 || stepIdx >= ANIMATION_STEPS.length) return;
  const step = ANIMATION_STEPS[stepIdx];
  const speed = parseInt(document.getElementById('speedSlider').value);

  // Update data
  data = [...step.array];

  // Count comparisons and swaps
  if (step.comparing && step.comparing.length >= 2) {
    cmpCount++;
  }
  if (step.swapping && step.swapping.length === 2) {
    swapCount++;
  }

  // Rebuild bars entirely to avoid translateX residue causing overlap
  const container = document.getElementById('arrayContainer');
  container.innerHTML = '';
  bars = [];
  data.forEach((val, idx) => {
    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.height = (val / maxVal * 180 + 20) + 'px';
    bar.style.background = COLORS[idx % COLORS.length];
    bar.innerHTML = `<span class="bar-label">${val}</span>`;

    // Apply highlight classes
    if (step.comparing && step.comparing.includes(idx)) {
      bar.classList.add('comparing');
    }
    if (step.swapping && step.swapping.includes(idx)) {
      bar.classList.add('swapping');
    }
    if (step.sorted && step.sorted.includes(idx)) {
      bar.classList.add('sorted');
    }

    container.appendChild(bar);
    bars.push(bar);
  });

  // Animate bar heights for smooth transition
  anime({
    targets: bars,
    height: (el, i) => (data[i] / maxVal * 180 + 20) + 'px',
    duration: speed * 0.5,
    easing: 'easeOutQuad'
  });

  // Update step description
  document.getElementById('stepDesc').textContent = step.description || '';
  currentStep = stepIdx;
  updateUI();
}

function nextStep() {
  if (currentStep < ANIMATION_STEPS.length - 1) {
    applyStep(currentStep + 1);
  }
}

function prevStep() {
  if (currentStep > 0) {
    applyStep(currentStep - 1);
  } else if (currentStep === 0) {
    resetState();
  }
}

function startAnimation() {
  resetState();
  setTimeout(() => nextStep(), 300);
}

function toggleAutoPlay() {
  if (isAutoPlaying) {
    stopAutoPlay();
    document.getElementById('btnAuto').textContent = '⏩ 自动播放';
  } else {
    isAutoPlaying = true;
    document.getElementById('btnAuto').textContent = '⏸ 暂停';
    autoPlayLoop();
  }
}

function autoPlayLoop() {
  if (!isAutoPlaying) return;
  if (currentStep >= ANIMATION_STEPS.length - 1) {
    stopAutoPlay();
    document.getElementById('btnAuto').textContent = '⏩ 自动播放';
    return;
  }
  nextStep();
  const speed = parseInt(document.getElementById('speedSlider').value);
  autoTimer = setTimeout(autoPlayLoop, speed + 200);
}

function stopAutoPlay() {
  isAutoPlaying = false;
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
}

// Speed slider
document.getElementById('speedSlider').addEventListener('input', function() {
  document.getElementById('speedLabel').textContent = this.value + 'ms';
});

// Button events
document.getElementById('btnStart').addEventListener('click', startAnimation);
document.getElementById('btnPrev').addEventListener('click', prevStep);
document.getElementById('btnNext').addEventListener('click', nextStep);
document.getElementById('btnAuto').addEventListener('click', toggleAutoPlay);
document.getElementById('btnReset').addEventListener('click', resetState);

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') { e.preventDefault(); nextStep(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevStep(); }
  else if (e.key === ' ') { e.preventDefault(); toggleAutoPlay(); }
});

// Initialize
createBars();
updateUI();
</script>
</body>
</html>
