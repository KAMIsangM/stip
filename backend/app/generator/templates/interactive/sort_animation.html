<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }}</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh; padding: 30px; color: #333;
}
.container { max-width: 960px; margin: 0 auto; }
.header {
  text-align: center; margin-bottom: 30px;
}
.header h1 { color: #fff; font-size: 28px; margin-bottom: 8px; }
.header p { color: rgba(255,255,255,0.8); font-size: 14px; }

/* Algorithm info card */
.info-card {
  background: rgba(255,255,255,0.95); border-radius: 12px;
  padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
}
.info-card h3 { color: #667eea; font-size: 18px; margin-bottom: 8px; }
.info-card p { color: #666; font-size: 14px; line-height: 1.6; }

/* Visualization area */
.viz-area {
  background: rgba(255,255,255,0.95); border-radius: 12px;
  padding: 30px; margin-bottom: 20px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  text-align: center; min-height: 420px;
}
.array-container {
  display: flex; justify-content: center; align-items: flex-end;
  gap: 10px; min-height: 200px; padding: 20px 0;
}
.bar {
  width: 55px; border-radius: 6px 6px 0 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: flex-end;
  transition: transform 0.2s;
  cursor: default; position: relative;
}
.bar-label {
  margin-bottom: 6px; font-size: 16px; font-weight: bold;
  color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.2);
}
.bar.comparing { 
  box-shadow: 0 0 15px rgba(255,107,107,0.6);
  transform: translateY(-8px);
}
.bar.swapping {
  box-shadow: 0 0 20px rgba(102,126,234,0.8);
  transform: translateY(-12px) scale(1.05);
}
.bar.sorted {
  box-shadow: 0 0 10px rgba(46,213,115,0.4);
}
.bar.shifting {
  opacity: 0.5;
  border: 2px dashed #999;
  box-shadow: 0 0 8px rgba(255,165,0,0.4);
}

/* === Tree visualization for heap sort === */
.tree-wrapper-el {
  display: flex; align-items: flex-start; justify-content: center;
  gap: 30px; min-height: 290px;
}
.tree-container-el {
  position: relative; width: 560px; height: 270px; flex-shrink: 0;
}
.tree-container-el svg {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  pointer-events: none;
}
.tree-node {
  position: absolute; width: 52px; height: 44px;
  border-radius: 10px; display: flex; align-items: center;
  justify-content: center; font-size: 18px; font-weight: bold;
  color: #fff; transition: all 0.35s ease;
  border: 3px solid transparent; z-index: 2;
}
.tree-node .idx-label {
  position: absolute; top: -18px; font-size: 11px; color: #999;
  font-weight: normal; white-space: nowrap;
}
.tree-node.comparing {
  border-color: #ff6b6b; box-shadow: 0 0 16px rgba(255,107,107,0.5);
  transform: scale(1.12);
}
.tree-node.swapping {
  border-color: #667eea; box-shadow: 0 0 20px rgba(102,126,234,0.7);
  transform: scale(1.15);
}
.tree-node.removed {
  opacity: 0.25; transform: scale(0.7); pointer-events: none;
}
.tree-line {
  stroke: #ccc; stroke-width: 2; fill: none;
  transition: stroke 0.35s;
}
.tree-line.highlight {
  stroke: #ff6b6b; stroke-width: 3;
}
.sorted-area-el {
  min-width: 120px; text-align: center;
}
.sorted-title-el {
  font-size: 14px; color: #888; margin-bottom: 8px;
}
.sorted-stack-el {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.sorted-item {
  width: 52px; height: 40px; border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: bold; color: #fff;
  border: 2px solid #2ed573; box-shadow: 0 0 8px rgba(46,213,115,0.3);
  transition: all 0.35s ease;
}
.sorted-item.new {
  animation: popIn 0.4s ease-out;
}
@keyframes popIn {
  0% { transform: scale(0); opacity: 0; }
  70% { transform: scale(1.15); }
  100% { transform: scale(1); opacity: 1; }
}
.array-row {
  display: flex; justify-content: center; gap: 8px; margin-top: 18px;
  flex-wrap: wrap;
}
.array-cell {
  width: 44px; height: 32px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600; color: #555;
  background: #f0f0f0; border: 2px solid #e0e0e0;
  transition: all 0.35s ease; position: relative;
}
.array-cell .cell-idx {
  position: absolute; top: -16px; font-size: 10px; color: #bbb;
}
.array-cell.comparing {
  border-color: #ff6b6b; background: #fff0f0; color: #ff6b6b;
}
.array-cell.swapping {
  border-color: #667eea; background: #eeeaff; color: #667eea;
}
.array-cell.sorted-cell {
  border-color: #2ed573; background: #e8f8ee; color: #2ed573;
}

/* Step indicator */
.step-info {
  margin-top: 20px; font-size: 15px; color: #555;
}
.step-number {
  display: inline-block; background: #667eea; color: #fff;
  padding: 4px 12px; border-radius: 20px; font-size: 13px;
  margin-right: 8px;
}

/* Controls */
.controls {
  display: flex; gap: 12px; justify-content: center;
  flex-wrap: wrap; margin-bottom: 20px;
}
.btn {
  padding: 10px 24px; border: none; border-radius: 25px;
  font-size: 14px; cursor: pointer; transition: all 0.3s;
  font-weight: 600; letter-spacing: 0.5px;
}
.btn-primary { background: #667eea; color: #fff; }
.btn-primary:hover { background: #5a6fd6; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(102,126,234,0.4); }
.btn-secondary { background: #e8e8e8; color: #555; }
.btn-secondary:hover { background: #ddd; }
.btn-success { background: #2ed573; color: #fff; }
.btn-success:hover { background: #26bc66; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Speed slider */
.speed-control {
  display: flex; align-items: center; gap: 10px;
  justify-content: center; margin-bottom: 20px; color: #fff;
}
.speed-control label { font-size: 13px; }
.speed-control input[type="range"] { width: 120px; }

/* Status bar */
.status-bar {
  background: rgba(255,255,255,0.9); border-radius: 8px;
  padding: 12px 20px; display: flex; justify-content: space-between;
  align-items: center; font-size: 13px; color: #666;
}
.status-bar .comparisons { color: #667eea; font-weight: bold; }
.status-bar .swaps { color: #2ed573; font-weight: bold; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>{{ title }}</h1>
    <p>{{ algorithm_name }} — {{ description }}</p>
  </div>

  <div class="info-card">
    <h3>📖 算法原理</h3>
    <p>{{ explanation }}</p>
  </div>

  <div class="viz-area">
    <div class="array-container" id="arrayContainer"></div>
    <div class="step-info">
      <span class="step-number" id="stepNum">0/0</span>
      <span id="stepDesc">点击"开始动画"演示排序过程</span>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-primary" id="btnStart">▶ 开始动画</button>
    <button class="btn btn-secondary" id="btnPrev">◀ 上一步</button>
    <button class="btn btn-secondary" id="btnNext">下一步 ▶</button>
    <button class="btn btn-success" id="btnAuto">⏩ 自动播放</button>
    <button class="btn btn-secondary" id="btnReset">↻ 重置</button>
  </div>

  <div class="speed-control">
    <label>⚡ 播放速度：</label>
    <input type="range" id="speedSlider" min="100" max="2000" value="800" step="50">
    <span id="speedLabel" style="min-width:45px;">800ms</span>
  </div>

  <div class="status-bar">
    <span>📊 数据量：<b>{{ element_count }}</b></span>
    <span class="comparisons">比较次数：<span id="cmpCount">0</span></span>
    <span class="swaps">交换次数：<span id="swapCount">0</span></span>
  </div>
</div>

<script>
// ===== Animation Data (injected by Jinja2) =====
const RAW_STEPS = {{ steps_json }};
const ALGORITHM_NAME = "{{ algorithm_name }}";
const INITIAL_ARRAY = {{ initial_array }};

// Generate correct steps client-side to fix LLM hallucination issues
function generateInsertionSortSteps(arr) {
  const steps = [];
  const a = [...arr];
  const n = a.length;
  steps.push({ array: [...a], comparing: [], swapping: [], sorted: [0], description: `初始数组：[${a.join(', ')}]，第一个元素已有序` });
  
  for (let i = 1; i < n; i++) {
    const key = a[i];
    let j = i - 1;
    // Show comparison before insertion
    if (j >= 0) {
      steps.push({ array: [...a], comparing: [j, i], swapping: [], sorted: Array.from({length: i}, (_,k)=>k), description: `取出 a[${i}]=${key}，与 a[${j}]=${a[j]} 比较` });
    }
    while (j >= 0 && a[j] > key) {
      const oldVal = a[j];
      a[j + 1] = a[j];
      steps.push({ array: [...a], comparing: [j, j+1], swapping: [], shifting: [j+1], sorted: Array.from({length: i}, (_,k)=>k), description: `${oldVal} > ${key}，将 a[${j}]=${oldVal} 后移到位置 ${j+1}` });
      j--;
    }
    a[j + 1] = key;
    const sortedIdx = Array.from({length: i + 1}, (_,k)=>k);
    steps.push({ array: [...a], comparing: [], swapping: [], sorted: sortedIdx, description: `将 ${key} 插入到位置 ${j + 1}，前 ${i + 1} 个元素已有序` });
  }
  return steps;
}

function generateBubbleSortSteps(arr) {
  const steps = [];
  const a = [...arr];
  const n = a.length;
  steps.push({ array: [...a], comparing: [], swapping: [], sorted: [], description: `初始数组：[${a.join(', ')}]` });
  for (let i = 0; i < n - 1; i++) {
    for (let j = 0; j < n - 1 - i; j++) {
      steps.push({ array: [...a], comparing: [j, j+1], swapping: [], sorted: Array.from({length: i}, (_,k)=>n-1-k), description: `比较 a[${j}]=${a[j]} 和 a[${j+1}]=${a[j+1]}` });
      if (a[j] > a[j + 1]) {
        [a[j], a[j+1]] = [a[j+1], a[j]];
        steps.push({ array: [...a], comparing: [], swapping: [j, j+1], sorted: Array.from({length: i}, (_,k)=>n-1-k), description: `${a[j+1]} > ${a[j]}，交换位置` });
      }
    }
    const sortedIdx = Array.from({length: i + 1}, (_,k)=>n-1-k);
    steps.push({ array: [...a], comparing: [], swapping: [], sorted: sortedIdx, description: `第 ${i+1} 轮结束，a[${n-1-i}]=${a[n-1-i]} 已归位` });
  }
  return steps;
}

function generateSelectionSortSteps(arr) {
  const steps = [];
  const a = [...arr];
  const n = a.length;
  steps.push({ array: [...a], comparing: [], swapping: [], sorted: [], description: `初始数组：[${a.join(', ')}]` });
  for (let i = 0; i < n - 1; i++) {
    let minIdx = i;
    for (let j = i + 1; j < n; j++) {
      steps.push({ array: [...a], comparing: [minIdx, j], swapping: [], sorted: Array.from({length: i}, (_,k)=>k), description: `比较 a[${minIdx}]=${a[minIdx]} 和 a[${j}]=${a[j]}，当前最小值 ${a[minIdx]}` });
      if (a[j] < a[minIdx]) {
        minIdx = j;
      }
    }
    if (minIdx !== i) {
      [a[i], a[minIdx]] = [a[minIdx], a[i]];
      steps.push({ array: [...a], comparing: [], swapping: [i, minIdx], sorted: Array.from({length: i}, (_,k)=>k), description: `交换 a[${i}] 和 a[${minIdx}]，最小值 ${a[i]} 归位` });
    }
    const sortedIdx = Array.from({length: i + 1}, (_,k)=>k);
    steps.push({ array: [...a], comparing: [], swapping: [], sorted: sortedIdx, description: `第 ${i+1} 轮结束，前 ${i+1} 个元素已有序` });
  }
  return steps;
}

function generateShellSortSteps(arr) {
  const steps = [];
  const a = [...arr];
  const n = a.length;
  let gap = Math.floor(n / 2);
  steps.push({ array: [...a], comparing: [], swapping: [], sorted: [], description: `初始数组：[${a.join(', ')}]，初始 gap=${gap}` });
  while (gap > 0) {
    for (let i = gap; i < n; i++) {
      const key = a[i];
      let j = i;
      // Show comparison before any shift
      if (j >= gap) {
        steps.push({ array: [...a], comparing: [j-gap, j], swapping: [], sorted: [], description: `gap=${gap}，取出 a[${j}]=${key}，与 a[${j-gap}]=${a[j-gap]} 比较` });
      }
      while (j >= gap && a[j-gap] > key) {
        const oldVal = a[j-gap];
        a[j] = a[j-gap];
        steps.push({ array: [...a], comparing: [j-gap, j], swapping: [], shifting: [j], sorted: [], description: `gap=${gap}，${oldVal} > ${key}，将 a[${j-gap}]=${oldVal} 后移到位置 ${j}` });
        j -= gap;
      }
      a[j] = key;
      if (j !== i) {
        steps.push({ array: [...a], comparing: [], swapping: [j, i], sorted: [], description: `gap=${gap}，将 ${key} 插入到位置 ${j}` });
      }
    }
    gap = Math.floor(gap / 2);
    if (gap > 0) {
      steps.push({ array: [...a], comparing: [], swapping: [], sorted: [], description: `gap 缩小为 ${gap}，数组当前状态：[${a.join(', ')}]` });
    }
  }
  // All sorted
  steps.push({ array: [...a], comparing: [], swapping: [], sorted: Array.from({length: n}, (_,k)=>k), description: `排序完成！` });
  return steps;
}

function heapify(a, heapSize, rootIdx, steps, phase) {
  let largest = rootIdx;
  const left = 2 * rootIdx + 1;
  const right = 2 * rootIdx + 2;
  if (left < heapSize && right < heapSize) {
    steps.push({ array: [...a], comparing: [rootIdx, left, right], swapping: [], sorted: [], description: `${phase}：比较根 a[${rootIdx}]=${a[rootIdx]} 与左右子节点 a[${left}]=${a[left]}、a[${right}]=${a[right]}` });
  } else if (left < heapSize) {
    steps.push({ array: [...a], comparing: [rootIdx, left], swapping: [], sorted: [], description: `${phase}：比较根 a[${rootIdx}]=${a[rootIdx]} 与左子节点 a[${left}]=${a[left]}` });
  } else {
    return; // leaf node, nothing to do
  }
  if (left < heapSize && a[left] > a[largest]) largest = left;
  if (right < heapSize && a[right] > a[largest]) largest = right;
  if (largest !== rootIdx) {
    const tmp = a[rootIdx];
    a[rootIdx] = a[largest];
    a[largest] = tmp;
    steps.push({ array: [...a], comparing: [rootIdx, largest], swapping: [rootIdx, largest], sorted: [], description: `${phase}：a[${largest}]=${a[rootIdx]} 最大，交换 a[${rootIdx}] 与 a[${largest}]` });
    heapify(a, heapSize, largest, steps, phase);
  } else {
    steps.push({ array: [...a], comparing: [rootIdx], swapping: [], sorted: [], description: `${phase}：a[${rootIdx}]=${a[rootIdx]} 已是最大，无需调整` });
  }
}

function generateHeapSortSteps(arr) {
  const steps = [];
  const a = [...arr];
  const n = a.length;
  steps.push({ array: [...a], comparing: [], swapping: [], sorted: [], description: `初始数组：[${a.join(', ')}]` });
  // Phase 1: Build max heap
  for (let i = Math.floor(n / 2) - 1; i >= 0; i--) {
    heapify(a, n, i, steps, '建堆');
  }
  steps.push({ array: [...a], comparing: [], swapping: [], sorted: [], description: `最大堆构建完成：[${a.join(', ')}]` });
  // Phase 2: Extract elements
  const sortedIndices = [];
  for (let i = n - 1; i > 0; i--) {
    const swapTemp = a[0];
    a[0] = a[i];
    a[i] = swapTemp;
    sortedIndices.push(i);
    steps.push({ array: [...a], comparing: [0, i], swapping: [0, i], sorted: [...sortedIndices], description: `交换堆顶 ${swapTemp} 与末尾 a[${i}]=${a[0]}，将 ${swapTemp} 固定到位置 ${i}` });
    heapify(a, i, 0, steps, '调整堆');
  }
  sortedIndices.push(0);
  steps.push({ array: [...a], comparing: [], swapping: [], sorted: sortedIndices.sort((x,y)=>x-y), description: `排序完成！最终结果：[${a.join(', ')}]` });
  return steps;
}

// Auto-generate correct steps based on algorithm name
function autoGenerateSteps() {
  const name = ALGORITHM_NAME.toLowerCase();
  if (name.includes('插入')) return generateInsertionSortSteps(INITIAL_ARRAY);
  if (name.includes('冒泡') || name.includes('bubble')) return generateBubbleSortSteps(INITIAL_ARRAY);
  if (name.includes('选择')) return generateSelectionSortSteps(INITIAL_ARRAY);
  if (name.includes('希尔') || name.includes('shell')) return generateShellSortSteps(INITIAL_ARRAY);
  if (name.includes('堆') || name.includes('heap')) return generateHeapSortSteps(INITIAL_ARRAY);
  return RAW_STEPS; // fallback to LLM-generated steps for unknown algorithms
}

const ANIMATION_STEPS = autoGenerateSteps();
const COLORS = ['#667eea','#764ba2','#f093fb','#f5576c','#4facfe','#43e97b','#fa709a','#fee140'];

// ===== Tree mode constants (for heap sort) =====
const IS_HEAP_SORT = ALGORITHM_NAME.toLowerCase().includes('堆') || ALGORITHM_NAME.toLowerCase().includes('heap');
const TREE_LAYOUT = [
  { lvl: 0, cx: 280, y: 0 },     // idx 0
  { lvl: 1, cx: 130, y: 95 },    // idx 1
  { lvl: 1, cx: 430, y: 95 },    // idx 2
  { lvl: 2, cx: 55,  y: 195 },   // idx 3
  { lvl: 2, cx: 205, y: 195 },   // idx 4
  { lvl: 2, cx: 355, y: 195 },   // idx 5
  { lvl: 2, cx: 505, y: 195 },   // idx 6
];
const TREE_NODE_W = 52, TREE_NODE_H = 44;

// ===== State =====
let currentStep = -1;
let bars = [];
let isAutoPlaying = false;
let autoTimer = null;
let cmpCount = 0;
let swapCount = 0;
let prevSortedLen = 0;

// ===== Initial data =====
let data = ANIMATION_STEPS.length > 0 ? [...ANIMATION_STEPS[0].array] : {{ initial_array }};
const maxVal = Math.max(...data);

// ===== Tree render helpers (heap sort only) =====
function getHeapSize(step) {
  if (!step.sorted || step.sorted.length === 0) return data.length;
  return data.length - step.sorted.length;
}

function ensureTreeStructure() {
  const container = document.getElementById('arrayContainer');
  if (!document.getElementById('treeWrapper')) {
    container.innerHTML = '<div class="tree-wrapper-el" id="treeWrapper"><div class="tree-container-el" id="treeContainer"></div><div class="sorted-area-el" id="sortedAreaEl"><div class="sorted-title-el">📕 已排序</div><div class="sorted-stack-el" id="sortedStackEl"></div></div></div><div class="array-row" id="arrayRow"></div>';
  }
}

function renderTree(step) {
  const container = document.getElementById('treeContainer');
  const heapSize = getHeapSize(step);
  const comparingSet = new Set(step.comparing || []);
  const swappingSet = new Set(step.swapping || []);
  const sortedSet = new Set(step.sorted || []);

  let svgHtml = '<svg>';
  for (let parent = 0; parent < heapSize; parent++) {
    const left = 2 * parent + 1;
    if (left < heapSize && !sortedSet.has(left)) {
      const p = TREE_LAYOUT[parent], c = TREE_LAYOUT[left];
      const h = (comparingSet.has(parent) && comparingSet.has(left)) || (swappingSet.has(parent) && swappingSet.has(left));
      svgHtml += `<line x1="${p.cx}" y1="${p.y + TREE_NODE_H}" x2="${c.cx}" y2="${c.y}" class="tree-line${h ? ' highlight' : ''}" />`;
    }
    const right = 2 * parent + 2;
    if (right < heapSize && !sortedSet.has(right)) {
      const p = TREE_LAYOUT[parent], c = TREE_LAYOUT[right];
      const h = (comparingSet.has(parent) && comparingSet.has(right)) || (swappingSet.has(parent) && swappingSet.has(right));
      svgHtml += `<line x1="${p.cx}" y1="${p.y + TREE_NODE_H}" x2="${c.cx}" y2="${c.y}" class="tree-line${h ? ' highlight' : ''}" />`;
    }
  }
  svgHtml += '</svg>';

  let nodesHtml = '';
  for (let i = 0; i < heapSize; i++) {
    if (sortedSet.has(i)) continue;
    const pos = TREE_LAYOUT[i];
    const cls = ['tree-node'];
    if (comparingSet.has(i)) cls.push('comparing');
    if (swappingSet.has(i)) cls.push('swapping');
    nodesHtml += `<div class="${cls.join(' ')}" style="left:${pos.cx - TREE_NODE_W/2}px;top:${pos.y}px;background:${COLORS[i % COLORS.length]};"><span class="idx-label">[${i}]</span>${step.array[i]}</div>`;
  }
  for (let i = heapSize; i < step.array.length; i++) {
    const pos = TREE_LAYOUT[i];
    nodesHtml += `<div class="tree-node removed" style="left:${pos.cx - TREE_NODE_W/2}px;top:${pos.y}px;background:${COLORS[i % COLORS.length]};"><span class="idx-label">[${i}]</span>${step.array[i]}</div>`;
  }
  container.innerHTML = svgHtml + nodesHtml;
}

function renderSorted(step) {
  const stack = document.getElementById('sortedStackEl');
  if (!step.sorted || step.sorted.length === 0) {
    stack.innerHTML = '<div style="font-size:12px;color:#ccc;">等待提取…</div>';
    prevSortedLen = 0;
    return;
  }
  prevSortedLen = step.sorted.length;
  const sorted = [...step.sorted].sort((a,b)=>a-b);
  let html = '';
  for (const idx of sorted) {
    html += `<div class="sorted-item" style="background:${COLORS[idx % COLORS.length]};">${step.array[idx]}</div>`;
  }
  stack.innerHTML = html;
}

function renderArrayRow(step) {
  const row = document.getElementById('arrayRow');
  const comparingSet = new Set(step.comparing || []);
  const swappingSet = new Set(step.swapping || []);
  const sortedSet = new Set(step.sorted || []);
  let html = '';
  step.array.forEach((val, idx) => {
    const cls = ['array-cell'];
    if (comparingSet.has(idx)) cls.push('comparing');
    if (swappingSet.has(idx)) cls.push('swapping');
    if (sortedSet.has(idx)) cls.push('sorted-cell');
    html += `<div class="${cls.join(' ')}"><span class="cell-idx">${idx}</span>${val}</div>`;
  });
  row.innerHTML = html;
}

function renderTreeAll(step) {
  ensureTreeStructure();
  renderTree(step);
  renderSorted(step);
  renderArrayRow(step);
}

// ===== Bar render helpers (non-heap algorithms) =====
function createBars() {
  const container = document.getElementById('arrayContainer');
  container.innerHTML = '';
  bars = [];
  data.forEach((val, idx) => {
    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.height = (val / maxVal * 180 + 20) + 'px';
    bar.style.background = COLORS[idx % COLORS.length];
    bar.innerHTML = `<span class="bar-label">${val}</span>`;
    container.appendChild(bar);
    bars.push(bar);
  });
}

function renderBarsStep(step, speed) {
  data = [...step.array];
  const container = document.getElementById('arrayContainer');
  container.innerHTML = '';
  bars = [];
  data.forEach((val, idx) => {
    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.height = (val / maxVal * 180 + 20) + 'px';
    bar.style.background = COLORS[idx % COLORS.length];
    bar.innerHTML = `<span class="bar-label">${val}</span>`;
    if (step.comparing && step.comparing.includes(idx)) bar.classList.add('comparing');
    if (step.swapping && step.swapping.includes(idx)) bar.classList.add('swapping');
    if (step.shifting && step.shifting.includes(idx)) bar.classList.add('shifting');
    if (step.sorted && step.sorted.includes(idx)) bar.classList.add('sorted');
    container.appendChild(bar);
    bars.push(bar);
  });
  anime({
    targets: bars,
    height: (el, i) => (data[i] / maxVal * 180 + 20) + 'px',
    duration: speed * 0.5,
    easing: 'easeOutQuad'
  });
}

function resetState() {
  currentStep = -1;
  cmpCount = 0;
  swapCount = 0;
  prevSortedLen = 0;
  if (ANIMATION_STEPS.length > 0) {
    data = [...ANIMATION_STEPS[0].array];
  }
  if (IS_HEAP_SORT) {
    renderTreeAll(ANIMATION_STEPS[0]);
  } else {
    createBars();
  }
  updateUI();
  stopAutoPlay();
}

function updateUI() {
  document.getElementById('stepNum').textContent = 
    `${Math.max(0, currentStep + 1)}/${ANIMATION_STEPS.length}`;
  document.getElementById('cmpCount').textContent = cmpCount;
  document.getElementById('swapCount').textContent = swapCount;
  document.getElementById('btnPrev').disabled = currentStep < 0;
  document.getElementById('btnNext').disabled = currentStep >= ANIMATION_STEPS.length - 1;
}

function applyStep(stepIdx) {
  if (stepIdx < 0 || stepIdx >= ANIMATION_STEPS.length) return;
  const step = ANIMATION_STEPS[stepIdx];
  const speed = parseInt(document.getElementById('speedSlider').value);

  if (step.comparing && step.comparing.length >= 2) cmpCount++;
  if (step.swapping && step.swapping.length === 2) swapCount++;

  if (IS_HEAP_SORT) {
    renderTreeAll(step);
  } else {
    renderBarsStep(step, speed);
  }

  document.getElementById('stepDesc').textContent = step.description || '';
  currentStep = stepIdx;
  updateUI();
}

function nextStep() {
  if (currentStep < ANIMATION_STEPS.length - 1) {
    applyStep(currentStep + 1);
  }
}

function prevStep() {
  if (currentStep > 0) {
    applyStep(currentStep - 1);
  } else if (currentStep === 0) {
    resetState();
  }
}

function startAnimation() {
  resetState();
  setTimeout(() => nextStep(), 300);
}

function toggleAutoPlay() {
  if (isAutoPlaying) {
    stopAutoPlay();
    document.getElementById('btnAuto').textContent = '⏩ 自动播放';
  } else {
    isAutoPlaying = true;
    document.getElementById('btnAuto').textContent = '⏸ 暂停';
    autoPlayLoop();
  }
}

function autoPlayLoop() {
  if (!isAutoPlaying) return;
  if (currentStep >= ANIMATION_STEPS.length - 1) {
    stopAutoPlay();
    document.getElementById('btnAuto').textContent = '⏩ 自动播放';
    return;
  }
  nextStep();
  const speed = parseInt(document.getElementById('speedSlider').value);
  autoTimer = setTimeout(autoPlayLoop, speed + 200);
}

function stopAutoPlay() {
  isAutoPlaying = false;
  if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
}

// Speed slider
document.getElementById('speedSlider').addEventListener('input', function() {
  document.getElementById('speedLabel').textContent = this.value + 'ms';
});

// Button events
document.getElementById('btnStart').addEventListener('click', startAnimation);
document.getElementById('btnPrev').addEventListener('click', prevStep);
document.getElementById('btnNext').addEventListener('click', nextStep);
document.getElementById('btnAuto').addEventListener('click', toggleAutoPlay);
document.getElementById('btnReset').addEventListener('click', resetState);

// Keyboard shortcuts
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight') { e.preventDefault(); nextStep(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); prevStep(); }
  else if (e.key === ' ') { e.preventDefault(); toggleAutoPlay(); }
});

// Initialize
if (IS_HEAP_SORT) {
  renderTreeAll(ANIMATION_STEPS[0]);
} else {
  createBars();
}
updateUI();
</script>
</body>
</html>
